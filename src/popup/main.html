<html>
    <head>
        <link rel="stylesheet" href="../styles/styles.css">
        <style>
            html{
                background-color: #FFF;
            }

            .section-header{
                font-size: 24px;
            }

            #calendar-picker{
                text-align: center;
            }

            #calendar-picker > a {
                justify-content: center;
                margin: -12px auto;
                width: 30%;
                height: 15%;
                text-decoration: none;
                color: #000;
                border-radius: 10px;
                border: 2px solid #000;
                display: inline-block;
                font-size: 18px;
                line-height: 1.5em;
                background-color: #f5fcff;
            }
            #calendar-picker > a:hover{
                background-color: #ecf8ff;
            }
            #calendar-picker > a:active{
                background-color: #cfedff;
            }

            #calendar-picker > input{
                width: 55%;
                margin-top: -12px;
                line-height: 2em;
            }

            input{
                border-radius: 10px;
                background-color: #f5fcff;
            }
            input:hover{
                background-color: #ecf8ff;
            }

            #size-selector{
                text-align: center;
            }

            #size-selector > input,
            #size-selector > label {
                display: inline-block;
                margin: -12px 4px;
                font-size: 16px;
                line-height: 1.5em;
            }
            #size-selector > input{
                width: 35%;
            }
            #size-selector > label{
                font-size: 18px;
            }

            #extension-info{
                width: 100%;
                text-align: center;
                position: absolute;
                bottom: 0px;
                left: 0px;
            }

            #extension-info > * {
                padding: 0px;
                margin: 0px;
            }

            #extension-info > hr {
                width: 85%;
                margin: auto;
            }

            #extension-info > p {
                display: inline-block;
                margin: 0px 2px;
            }

            .info-title{
                color: #888;
            }
            .info-data{
                color: #000;
            }

            #birthday-message{
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="calendar-picker">
            <h1 class="section-header">Go To Date:</h1>
            <input type="date" id="date-picker">
            <a id="game-link" target="_blank" href="https://www.nytimes.com/crosswords/game/mini">Go!</a>
        </div>
        <div id="size-selector">
            <h1 class="section-header">Preferred Size:</h1>
            <label>Size: </label><input type="number" id="size-input" value="20">
        </div>

        <div id="extension-info">
            <hr>
            <p>Name: NYT MiniMax</p>
            <br>
            <p>Version: X.X.XX</p>
        </div>
        <div id="birthday-message">
            Happy Birthday Mom!
        </div>

        <script type="module" src="popup.js"></script>
    </body>
</html>
